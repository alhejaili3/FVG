<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ميزان القيمة العادلة</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FVG">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0c1412">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Reem+Kufi:wght@500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* Layout: trading-desk shell — fixed side rail of book chapters, scrolling work surface of ledger-like panels. Dark-first ink with assay gold (the book's own gold). */
:root{
  --bg:#0c1412; --panel:#121e1b; --panel2:#172623; --sunk:#0a110f; --line:#22342f; --line2:#2d443d;
  --fg:#ebe6d8; --muted:#8fa199; --faint:#5f726b;
  --gold:#d6b25e; --gold2:#f1d793; --goldInk:#1a1406;
  --up:#4cc38a; --down:#e86a5c; --warn:#e3b341; --info:#6fb3d9;
  --upBg:rgba(76,195,138,.12); --downBg:rgba(232,106,92,.12); --warnBg:rgba(227,179,65,.12); --infoBg:rgba(111,179,217,.12);
  --f-display:"Reem Kufi","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:10px; --shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f3f1ea; --panel:#ffffff; --panel2:#f8f6ef; --sunk:#ece8dc; --line:#e0dacb; --line2:#cfc7b3;
    --fg:#1b2420; --muted:#5d6b64; --faint:#8e998f;
    --gold:#94701c; --gold2:#6f520e; --goldInk:#fffaf0;
    --up:#1c8753; --down:#bf3b2d; --warn:#9c7100; --info:#2370a0;
    --upBg:rgba(28,135,83,.10); --downBg:rgba(191,59,45,.09); --warnBg:rgba(156,113,0,.10); --infoBg:rgba(35,112,160,.09);
    --shadow:0 1px 2px rgba(40,30,0,.06), 0 6px 20px rgba(40,30,0,.05);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#f3f1ea; --panel:#ffffff; --panel2:#f8f6ef; --sunk:#ece8dc; --line:#e0dacb; --line2:#cfc7b3;
  --fg:#1b2420; --muted:#5d6b64; --faint:#8e998f;
  --gold:#94701c; --gold2:#6f520e; --goldInk:#fffaf0;
  --up:#1c8753; --down:#bf3b2d; --warn:#9c7100; --info:#2370a0;
  --upBg:rgba(28,135,83,.10); --downBg:rgba(191,59,45,.09); --warnBg:rgba(156,113,0,.10); --infoBg:rgba(35,112,160,.09);
  --shadow:0 1px 2px rgba(40,30,0,.06), 0 6px 20px rgba(40,30,0,.05);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14.5px;line-height:1.65;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--gold)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.num,.mono{font-family:var(--f-num);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.app{min-height:100%;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;
  padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));
  background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;gap:12px;align-items:center;min-width:0}
.logo{width:38px;height:38px;color:var(--gold);flex:none}
.brand-name{font-family:var(--f-display);font-size:21px;font-weight:700;letter-spacing:0;color:var(--gold2);line-height:1.2}
.brand-sub{font-size:12px;color:var(--muted)}
.co-bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.co-bar select{width:auto;min-width:200px;max-width:320px}

.body{flex:1;display:grid;grid-template-columns:232px minmax(0,1fr);min-height:0}
.side{border-left:1px solid var(--line);padding:16px 10px;display:flex;flex-direction:column;gap:2px;position:sticky;top:61px;align-self:start;max-height:calc(100vh - 61px);overflow:auto}
.side .grp{font-size:11px;color:var(--faint);letter-spacing:.04em;padding:14px 12px 4px}
.side button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;color:var(--muted);font-size:14px}
.side button .k{font-family:var(--f-num);font-size:11px;color:var(--faint);min-width:18px}
.side button:hover{background:var(--panel2);color:var(--fg)}
.side button.on{background:var(--panel2);color:var(--gold2);box-shadow:inset -3px 0 0 var(--gold)}
.side button:focus-visible{outline:2px solid var(--gold)}
.view{padding-block:22px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0;max-width:1320px;width:100%}

@media (max-width:900px){
  .body{grid-template-columns:1fr}
  .side{position:static;max-height:none;flex-direction:row;overflow-x:auto;border-left:0;border-bottom:1px solid var(--line);padding:8px max(16px,env(safe-area-inset-left,0px));gap:4px}
  .side .grp{display:none}
  .side button{white-space:nowrap;padding:7px 10px}
  .side button.on{box-shadow:inset 0 -2px 0 var(--gold)}
  .co-bar select{min-width:0;flex:1 1 160px}
}

h1.vt{font-family:var(--f-display);font-weight:600;font-size:28px;margin:0 0 4px;color:var(--fg);text-wrap:balance;line-height:1.3}
.vsub{color:var(--muted);margin:0 0 20px;max-width:75ch}
h2.st{font-family:var(--f-display);font-weight:600;font-size:18px;margin:0 0 12px;color:var(--gold2);display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h3{font-size:15px;margin:0 0 8px;font-weight:600}
.pg{font-family:var(--f-num);font-size:11px;color:var(--faint);border:1px solid var(--line);border-radius:20px;padding:0 8px;font-weight:400;white-space:nowrap}
.muted{color:var(--muted)} .small{font-size:12.5px} .faint{color:var(--faint)}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.panel.flat{box-shadow:none;background:var(--panel2)}
.stack{display:flex;flex-direction:column;gap:16px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.gauto{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.g2,.g3,.g4{grid-template-columns:1fr}}
.row{display:flex;align-items:center;flex-wrap:wrap}
.gap{gap:8px} .gap2{gap:16px}
.spread{justify-content:space-between}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--gold);background:var(--gold);color:var(--goldInk);padding:7px 14px;border-radius:8px;cursor:pointer;font-weight:600;font-size:13.5px;white-space:nowrap;line-height:1.4}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line2);font-weight:500}
.btn.ghost:hover{border-color:var(--gold);color:var(--gold2)}
.btn.danger{border-color:var(--down);background:transparent;color:var(--down)}
.btn.icon{padding:7px 10px}
.btn.sm{padding:4px 10px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}

.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f label{font-size:12.5px;color:var(--muted)}
.f .hint{font-size:11.5px;color:var(--faint)}
input[type=text],input[type=password],input[type=number],input[type=date],select,textarea{
  width:100%;background:var(--sunk);border:1px solid var(--line);border-radius:7px;padding:7px 10px;min-height:36px;transition:border-color .15s}
input:focus,select:focus,textarea:focus{border-color:var(--gold);outline:none}
input.n{font-family:var(--f-num);direction:ltr;text-align:right}
textarea{min-height:90px;resize:vertical;line-height:1.6}
.fields{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}

/* hero value plate */
.plate{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:0;border:1px solid var(--line2);border-radius:14px;overflow:hidden;background:linear-gradient(135deg,color-mix(in srgb,var(--gold) 10%,var(--panel)),var(--panel) 55%)}
@media (max-width:760px){.plate{grid-template-columns:1fr}}
.plate .a{padding:22px 24px;border-left:1px solid var(--line)}
.plate .b{padding:18px 22px;display:grid;grid-template-columns:1fr 1fr;gap:14px 18px;align-content:center}
.big{font-family:var(--f-num);font-size:clamp(38px,6vw,58px);font-weight:600;color:var(--gold2);line-height:1.05;direction:ltr;text-align:right;letter-spacing:-.02em}
.big small{font-size:.35em;color:var(--muted);font-weight:400;margin-inline-start:6px}
.kv .k{font-size:12px;color:var(--muted)}
.kv .v{font-family:var(--f-num);font-size:19px;font-weight:500;font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:2px 10px;border-radius:20px;border:1px solid var(--line2);color:var(--muted);white-space:nowrap}
.chip.up{color:var(--up);border-color:color-mix(in srgb,var(--up) 45%,transparent);background:var(--upBg)}
.chip.down{color:var(--down);border-color:color-mix(in srgb,var(--down) 45%,transparent);background:var(--downBg)}
.chip.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent);background:var(--warnBg)}
.chip.info{color:var(--info);border-color:color-mix(in srgb,var(--info) 45%,transparent);background:var(--infoBg)}
.chip.gold{color:var(--gold2);border-color:var(--gold)}
.signal{display:flex;gap:14px;align-items:center;padding:14px 16px;border-radius:10px;border:1px solid var(--line2);background:var(--panel2)}
.signal .s{font-family:var(--f-display);font-size:22px;font-weight:700;min-width:84px;text-align:center}
.signal.buy{border-color:color-mix(in srgb,var(--up) 50%,transparent);background:var(--upBg)} .signal.buy .s{color:var(--up)}
.signal.sell{border-color:color-mix(in srgb,var(--down) 50%,transparent);background:var(--downBg)} .signal.sell .s{color:var(--down)}
.signal.hold .s{color:var(--warn)}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-weight:500;color:var(--muted);font-size:12px;text-align:right;padding:8px 10px;background:var(--panel2);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.n,th.n{font-family:var(--f-num);font-variant-numeric:tabular-nums;text-align:left;white-space:nowrap}
td input{min-height:32px;padding:5px 8px}
tfoot td{font-weight:600;background:var(--panel2)}

/* narrative steps of the revised equation */
.steps{display:flex;flex-direction:column;counter-reset:s}
.step{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 4px;border-bottom:1px dashed var(--line)}
.step:last-child{border-bottom:0}
.step .no{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-num);font-size:12px;border:1px solid var(--gold);color:var(--gold2)}
.step .t{font-weight:500}
.step .d{font-size:12.5px;color:var(--muted)}
.step .r{font-family:var(--f-num);text-align:left;font-size:15px;white-space:nowrap}
.step.final{background:color-mix(in srgb,var(--gold) 10%,transparent);border-radius:8px;border-bottom:0;margin-top:4px}
.step.final .no{background:var(--gold);color:var(--goldInk)}
.step.final .r{color:var(--gold2);font-size:20px;font-weight:600}
@media (prefers-reduced-motion:no-preference){
  .step{animation:rise .35s both}
  @keyframes rise{from{transform:translateY(4px);opacity:.4}to{transform:none;opacity:1}}
}

.formula{font-family:var(--f-num);direction:ltr;text-align:left;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:13px;overflow-x:auto;white-space:nowrap}
.formula.ar{font-family:var(--f-body);direction:rtl;text-align:right;white-space:normal}
.outs{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.out{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 10px;border-radius:7px;background:var(--panel2);flex-wrap:wrap}
.out .l{font-size:13px;color:var(--muted)}
.out .v{font-family:var(--f-num);font-weight:500;font-variant-numeric:tabular-nums}
.out .note{flex-basis:100%;font-size:12px}
.calc h3{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.calc .fields{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
details.acc{border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
details.acc>summary{cursor:pointer;padding:14px 18px;font-family:var(--f-display);font-size:17px;color:var(--gold2);list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary::after{content:"＋";color:var(--muted);font-family:var(--f-num)}
details.acc[open]>summary::after{content:"－"}
details.acc>.in{padding:0 18px 18px}

.banner{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-radius:8px;border:1px solid color-mix(in srgb,var(--info) 45%,transparent);background:var(--infoBg);color:var(--fg);font-size:13.5px}
.banner.warn{border-color:color-mix(in srgb,var(--warn) 45%,transparent);background:var(--warnBg)}
.chart-box{position:relative;height:280px;width:100%}
.chart-box.sm{height:220px}
.bar{height:8px;border-radius:6px;background:var(--sunk);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--gold);border-radius:6px}
.ladder{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.rung{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--panel2)}
.rung .k{font-size:12px;color:var(--muted)} .rung .v{font-family:var(--f-num);font-size:16px}
.rung.buy{border-color:color-mix(in srgb,var(--up) 40%,transparent)} .rung.sell{border-color:color-mix(in srgb,var(--down) 40%,transparent)}

/* AI */
.ai-card{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);display:flex;flex-direction:column;min-width:0}
.ai-card .hd{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);gap:8px}
.ai-card .nm{font-family:var(--f-display);font-size:17px}
.ai-card .bd{padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.dot{width:9px;height:9px;border-radius:50%;background:var(--faint);display:inline-block}
.dot.run{background:var(--warn);animation:pulse 1s infinite}
.dot.ok{background:var(--up)} .dot.err{background:var(--down)}
@keyframes pulse{50%{opacity:.3}}
.md{font-size:13.5px;line-height:1.8;overflow-wrap:anywhere}
.md p{margin:0 0 8px}
.md ul{margin:0 0 8px;padding-inline-start:20px}
.src{display:flex;flex-direction:column;gap:2px;font-size:12px;max-height:150px;overflow:auto}
.src a{overflow-wrap:anywhere}
pre.raw{max-height:260px;overflow:auto;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:11.5px;direction:ltr;text-align:left;white-space:pre-wrap;overflow-wrap:anywhere}

.check{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--line)}
.check:last-child{border-bottom:0}
.check input{margin-top:5px;accent-color:var(--gold);width:16px;height:16px;flex:none}
.score{display:flex;gap:4px}
.score button{all:unset;cursor:pointer;width:28px;height:26px;border-radius:6px;border:1px solid var(--line2);display:grid;place-items:center;font-family:var(--f-num);font-size:12px;color:var(--muted)}
.score button.on{background:var(--gold);color:var(--goldInk);border-color:var(--gold)}
.score button:focus-visible{outline:2px solid var(--gold)}
.ref-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:12px 0;border-bottom:1px solid var(--line)}
.ref-item:last-child{border-bottom:0}
.ref-item .formula{grid-column:1/-1}

.confirm{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;z-index:50;padding:16px}
.confirm-box{background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:20px;max-width:420px;width:100%}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--gold);color:var(--fg);padding:10px 18px;border-radius:10px;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line2);border-radius:var(--r)}
.fields .wide{grid-column:1/-1}
[hidden]{display:none!important}
th.n{font-family:var(--f-body)}

</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <svg class="logo" viewBox="0 0 48 48" aria-hidden="true"><path d="M24 6v32M10 38h28M8 14h32" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round"/><path d="M8 14l-5 11a6 3 0 0 0 10 0zM40 14l-5 11a6 3 0 0 0 10 0z" fill="currentColor" opacity=".85"/><circle cx="24" cy="6" r="2.6" fill="currentColor"/></svg>
      <div>
        <div class="brand-name">ميزان القيمة العادلة</div>
        <div class="brand-sub">على منهج كتاب «تجربة تسوق في متاجر الأسهم»</div>
      </div>
    </div>
    <div class="co-bar">
      <label class="sr" for="coSelect">الشركة</label>
      <select id="coSelect"></select>
      <button class="btn ghost" id="btnNew" title="شركة جديدة">＋ جديدة</button>
      <button class="btn ghost" id="btnDup" title="نسخ الشركة">نسخ</button>
      <button class="btn ghost danger" id="btnDel" title="حذف الشركة">حذف</button>
      <button class="btn ghost" id="btnExport" title="تصدير كل البيانات">تصدير</button>
      <label class="btn ghost" title="استيراد ملف بيانات">استيراد<input type="file" id="fileImport" accept=".json" hidden></label>
      <button class="btn ghost" id="btnTheme" title="تبديل المظهر">فاتح / داكن</button>
    </div>
  </header>
  <div class="body">
    <nav class="side" id="nav"></nav>
    <main id="view" class="view"></main>
  </div>
  <div id="confirm" class="confirm" hidden>
    <div class="confirm-box"><p id="confirmMsg"></p><div class="row gap"><button class="btn danger" id="confirmYes">تأكيد</button><button class="btn ghost" id="confirmNo">إلغاء</button></div></div>
  </div>
  <div id="toast" class="toast" hidden></div>
</div>
<script>
const SAUDI_RAW = `2222|أرامكو السعودية|Saudi Aramco|الطاقة
2030|المصافي العربية السعودية (ساركو)|SARCO|الطاقة
2380|بترو رابغ|Petro Rabigh|الطاقة
2381|الحفر العربية|Arabian Drilling|الطاقة
2382|أديس القابضة|ADES Holding|الطاقة
4030|البحري|Bahri|الطاقة
4200|الدريس|Aldrees|الطاقة
1201|تكوين المتطورة للصناعات|Takween Advanced Industries|المواد الأساسية
1202|مبكو|MEPCO|المواد الأساسية

  partial: { t: 'تحول جزئي (خاسرة لآخر سنة)', cls: 'down', page: 'ص28–29', d: 'انخفاض الإيرادات التشغيلية عن المصروفات لمدة سنة.' },
  shrink: { t: 'تحول جزئي (منكمشة)', cls: 'warn', page: 'ص30', d: 'انخفاض الإيرادات التشغيلية عن السابقة لمدة سنة.' },
  growth: { t: 'نمو', cls: 'up', page: 'ص31–32', d: 'نمو مستمر في حقوق المساهمين والمبيعات، أو زيادات متكررة في رأس المال.' },
  dividend: { t: 'نضج وعوائد', cls: 'info', page: 'ص33', d: 'ثبات نسبي في الأرباح وتوزيعات مستمرة لا تنقطع.' },
  cyclical: { t: 'دورية', cls: 'warn', page: 'ص34', d: 'تقلب في الأرباح وعدم استمرار النمو أو الخسائر.' }
};
function classify(c) {
  const tests = [];
  const T = (key, name, pass, detail, page, known = true) => tests.push({ key, name, pass, detail, page, known });
  const eq = num(c.equity), sh = num(c.shares), nom = has(c.nominal) ? num(c.nominal) : 10, cap = num(c.capital);
  // full turnaround — equity ÷ capital, book value vs nominal value
  if (!isNaN(eq) && sh) {
    const bv = eq / sh, ratio = cap ? eq / cap : NaN;
    T('full', 'خاسرة من رأس المال', bv < nom || eq < 0, `القيمة الدفترية ${fmt(bv)} مقابل الاسمية ${fmt(nom)}${isNaN(ratio) ? '' : ` · حقوق المساهمين ÷ رأس المال = ${fmt(ratio, 2)}`}`, 'ص26–27');
  } else T('full', 'خاسرة من رأس المال', false, 'أدخل حقوق المساهمين وعدد الأسهم', 'ص26–27', false);
  // partial — net income − other revenues < 0
  const ni = num(c.netIncome), oi = nz(c.otherIncome);
  if (!isNaN(ni)) { const op = ni - oi; T('partial', 'خاسرة لآخر سنة', op < 0, `صافي الدخل − الإيرادات الأخرى = ${money(op)}`, 'ص28–29'); }
  else T('partial', 'خاسرة لآخر سنة', false, 'أدخل صافي الدخل والإيرادات الأخرى لآخر سنة', 'ص28–29', false);
  // shrinking — four past quarters of operating income, each quarter minus the previous
  const qn = arr(c.q && c.q.net), qo = arr(c.q && c.q.other);
  if (qn.length >= 2) {
    const ops = qn.map((v, i) => v - (qo[i] || 0)); const diffs = ops.slice(1).map((v, i) => v - ops[i]);
    const neg = diffs.filter(d => d < 0).length; const shrinking = ops[ops.length - 1] < ops[0] && neg >= diffs.length / 2;
    T('shrink', 'منكمشة (4 أرباع)', shrinking, `فروق الأرباع التشغيلية: ${diffs.map(d => money(d, 1)).join(' ، ')}`, 'ص30');
  } else T('shrink', 'منكمشة (4 أرباع)', false, 'أدخل صافي الدخل والإيرادات الأخرى لأربعة أرباع', 'ص30', false);
  // growth — equity and sales increasing continuously, or several capital increases
  const he = arr(c.hist.equity), hr = arr(c.hist.revenue);
  const inc = a => a.length >= 2 && a.every((v, i) => i === 0 || v > a[i - 1]);
  const capInc = nz(c.capIncreases);
  if (he.length >= 2 || hr.length >= 2 || has(c.capIncreases)) {
    const g = (inc(he) && inc(hr)) || capInc >= 2;
    T('growth', 'شركة نمو', g, `حقوق المساهمين ${inc(he) ? 'في ازدياد مستمر' : 'غير مستمرة النمو'} · المبيعات ${inc(hr) ? 'في ازدياد مستمر' : 'غير مستمرة النمو'} · زيادات رأس المال: ${fmt(capInc, 0)}`, 'ص31–32');
  } else T('growth', 'شركة نمو', false, 'أدخل تاريخ حقوق المساهمين والمبيعات', 'ص31–32', false);
  // dividend — continuous distributions + relative stability of profit
  const dps = arr(c.hist.dps), hn = arr(c.hist.netIncome);
  if (dps.length >= 2) {
    const cont = dps.every(d => d > 0); const stab = cv(hn);
    T('dividend', 'شركة عوائد', cont && (isNaN(stab) || stab < 0.2), `توزيعات ${cont ? 'مستمرة' : 'منقطعة'} · تذبذب الأرباح ${isNaN(stab) ? '—' : pct(stab * 100)}`, 'ص33');
  } else T('dividend', 'شركة عوائد', false, 'أدخل توزيعات السهم للسنوات الماضية', 'ص33', false);
  // cyclical — fluctuating profit, no continuous growth or loss
  if (hn.length >= 3) {
    const gs = growthSeries(hn); const signs = gs.map(Math.sign); const flips = signs.slice(1).filter((s, i) => s && signs[i] && s !== signs[i]).length;
    T('cyclical', 'شركة دورية', flips >= 1 && !inc(hn), `تغيّر اتجاه الأرباح ${flips} مرة`, 'ص34');
  } else T('cyclical', 'شركة دورية', false, 'أدخل صافي الدخل لثلاث سنوات على الأقل', 'ص34', false);
  const pass = k => tests.find(t => t.key === k && t.pass);
  const order = ['full', 'partial', 'shrink', 'growth', 'dividend', 'cyclical'];
  const primary = order.find(k => pass(k)) || null;
  // history (p.35), size (p.36), activity (p.37–38), sharia (p.24–25)
  const yr = new Date().getFullYear(); const fy = num(c.founded);
  const history = isNaN(fy) ? null : (yr - fy < 10 ? 'حديثة (أقل من 10 سنوات)' : 'تاريخية (10 سنوات فأكثر)');
  let size = null; const sa = num(c.sectorAvgCapital);
  if (cap && sa) { const r = cap / sa; size = r < 0.5 ? 'صغيرة' : r <= 1.5 ? 'متوسطة' : 'كبيرة'; }
  return { tests, primary, info: primary ? CLASS_INFO[primary] : null, history, size, activity: c.activity || null, sharia: c.sharia };
}

/* ========= ENGINE 4 — trading memo (p.209) + method 3 (p.12) ========= */
function signal(c, R, cl) {
  const price = num(c.price), fv = R.fv;
  if (isNaN(price) || isNaN(fv)) return { s: 'hold', label: '—', why: 'أدخل السعر والبيانات لحساب القيمة العادلة.' };
  const disc = (fv - price) / fv * 100;
  const fvNow = revised(c, 0).fv, fvNext = revised(c, Math.max(1, R.n)).fv;
  const fvG = (fvNext - fvNow) / Math.abs(fvNow) * 100 / Math.max(1, R.n);
  const pg = num(c.priceGrowth); const entry = num(c.entryPrice);
  const k = cl.primary;
  if (k === 'shrink' && fvG < 0) return { s: 'sell', label: 'بيع', why: 'شركة انكماش + قيمة عادلة تتناقص حسب البيانات المتوقعة.', rule: 'مذكرة التداول ص209' };
  if (k === 'growth' || k === 'partial' && fvG > 0) {
    if (!isNaN(pg)) {
      if (pg > fvG + 1) return { s: 'sell', label: 'بيع', why: `شركة نمو + السعر ينمو (${pct(pg)}) بأكثر من نمو القيمة العادلة (${pct(fvG)}).`, rule: 'مذكرة التداول ص209' };
      return { s: 'buy', label: 'شراء', why: `شركة نمو + السعر ينمو (${pct(pg)}) بوتيرة لا تتجاوز نمو القيمة العادلة (${pct(fvG)}).`, rule: 'مذكرة التداول ص209' };
    }
  }
  if (k === 'dividend' || k === null || k === 'cyclical' || k === 'growth') {
    if (price <= fv * 0.75) return { s: 'buy', label: 'شراء', why: `السعر أقل من القيمة العادلة بـ ${pct(disc)} (الشرط 25% فأكثر).`, rule: 'مذكرة التداول ص209 · الطريقة الثالثة ص12' };
    if (!isNaN(entry) && price <= entry * 0.75) return { s: 'buy', label: 'تعزيز', why: `السعر أقل من متوسط شرائك (${fmt(entry)}) بـ 25% فأكثر.`, rule: 'مذكرة التداول ص209' };
    if (price >= fv * 1.10) return { s: 'sell', label: 'بيع', why: `السعر أعلى من القيمة العادلة بـ ${pct(-disc)} (الشرط 10% فأكثر).`, rule: 'مذكرة التداول ص209' };
  }
  if (k === 'full' || k === 'partial') return { s: 'hold', label: 'حذر', why: 'شركة تحول: تُقيَّم في ظروف الخسارة بالقيمة الدفترية (ص14)، ومخاطرة مرتفعة.', rule: 'ص14، ص26–29' };
  return { s: 'hold', label: 'انتظار', why: disc >= 0 ? `السعر دون القيمة العادلة بـ ${pct(disc)}؛ لم يبلغ هامش الأمان 25%.` : `السعر فوق القيمة العادلة بـ ${pct(-disc)}؛ لم يبلغ حد البيع 10%.`, rule: 'مذكرة التداول ص209' };
}

function fid(scope, path) { return 'f-' + scope + '-' + path.replace(/[^\w]/g, '-'); }
function fld(path, label, opt = {}) {
  const scope = opt.scope || 'b';
  const src = scope === 's' ? SET : scope === 'g' ? DB : cur();
  const val = getPath(src, path) ?? '';
  const id = fid(scope, path);
  let ctl;
  if (opt.sel) ctl = `<select id="${id}" data-${scope}="${path}">${opt.sel.map(x => { const [v, t] = Array.isArray(x) ? x : [x, x || '—']; return `<option value="${esc(v)}"${String(val) === String(v) ? ' selected' : ''}>${esc(t)}</option>`; }).join('')}</select>`;
  else if (opt.area) ctl = `<textarea id="${id}" data-${scope}="${path}" placeholder="${esc(opt.ph || '')}">${esc(val)}</textarea>`;
  else ctl = `<input id="${id}" type="${opt.type || 'text'}" data-${scope}="${path}" class="${opt.text ? '' : 'n'}" value="${esc(val)}" placeholder="${esc(opt.ph || '')}" autocomplete="off"${opt.ro ? ' readonly' : ''}>`;
  return `<div class="f ${opt.cls || ''}"><label for="${id}">${esc(label)}</label>${ctl}${opt.hint ? `<span class="hint">${esc(opt.hint)}</span>` : ''}</div>`;
}
function outRow(x) {
  let v;
  if (x.kind === 'text') v = `<span>${esc(x.v)}</span>`;
  else { const s = x.kind === 'money' ? money(x.v) : x.kind === 'pct' ? pct(x.v) : x.kind === 'sar' ? sar(x.v) : fmt(x.v); v = `<span class="v">${s}</span>`; }
  const empty = x.kind === 'text' ? (x.v === '—' || x.v === '' || x.v == null) : (x.v === null || x.v === undefined || isNaN(x.v) || !isFinite(x.v));
  const ch = x.st && !empty ? `<span class="chip ${x.st}">${x.st === 'up' ? 'إيجابي' : x.st === 'down' ? 'سلبي' : x.st === 'warn' ? 'انتبه' : 'معلومة'}</span>` : '';

}

  ];

}

function indEval(I, vals) {
  if (vals.length < 2 && I.rel !== '<100') return { t: 'يحتاج قيمتين على الأقل', st: '' };
  const g = avgGrowth(vals); const last = vals[vals.length - 1];
  if (I.rel === '+') return g >= 0 ? { t: 'في ارتفاع: إيجابي', st: 'up' } : { t: 'في انخفاض: سلبي', st: 'down' };
  if (I.rel === '-') return g <= 0 ? { t: 'في انخفاض: إيجابي', st: 'up' } : { t: 'في ارتفاع: سلبي', st: 'down' };
  if (I.rel === '<100') return isNaN(last) ? { t: '—', st: '' } : last < 100 ? { t: 'أقل من 100%: إيجابي', st: 'up' } : { t: '100% فأكثر: سلبي', st: 'down' };
  if (I.id === 'capital') return { t: 'في شركات النمو يعد صغر رأس المال إيجابياً، وفي شركات العوائد كبره', st: 'info' };
  return { t: g >= 0 ? 'في ارتفاع' : 'في انخفاض', st: 'info' };
}
function indSummary(c) {
  const rows = IND.filter(I => c.ind && c.ind[I.id] && arr(c.ind[I.id].vals).length);
  if (!rows.length) return '<div class="empty">لم تُدخل قيم لأي مؤشر بعد. اختر مؤشراً وأدخل قيمه المحققة.</div>';
  const ev = rows.map(I => ({ I, e: indEval(I, arr(c.ind[I.id].vals)) }));
  const up = ev.filter(x => x.e.st === 'up').length, down = ev.filter(x => x.e.st === 'down').length;
  return `<div class="row gap" style="margin-bottom:10px">${chip(up + ' إيجابي', 'up')}${chip(down + ' سلبي', 'down')}</div><div class="tw"><table><thead><tr><th>المؤشر</th><th>الصفحة</th><th class="n">متوسط النمو</th><th>الحكم</th></tr></thead><tbody>${ev.map(x => `<tr><td><button class="btn ghost sm" data-act="pickInd" data-id="${x.I.id}">${esc(x.I.t)}</button></td><td class="faint">${x.I.page}</td><td class="n">${pct(avgGrowth(arr(c.ind[x.I.id].vals)))}</td><td>${chip(x.e.t, x.e.st)}</td></tr>`).join('')}</tbody></table></div>`;
}

/* ========= Saudi market universe — Tadawul main market, REITs and Nomu ========= */
const SAUDI = SAUDI_RAW.trim().split('\n').map(l => { const [s, ar, en, sec] = l.split('|'); const mk = sec === 'نمو' ? 'nomu' : sec === 'الصناديق العقارية' ? 'reit' : 'main'; return { s, ar, en, sec: mk === 'nomu' ? 'السوق الموازية (نمو)' : sec, mk }; });
const MK_TXT = { main: 'السوق الرئيسية', reit: 'صناديق ريت', nomu: 'نمو' };
const normAr = t => String(t || '').toLowerCase().replace(/[إأآا]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه').replace(/[ًٌٍَُِّْـ]/g, '');
const QUEUE = { items: [], running: false, current: null, done: 0, total: 0 };
const coBySym = s => DB.companies.find(c => String(c.symbol) === String(s));

function openStock(st) {
  let c = coBySym(st.s);
  if (!c) { c = newCompany(st.ar); c.symbol = st.s; c.sector = st.sec; c.market = st.mk; c.en = st.en; c.products = [newProduct()]; DB.companies.push(c); }
  DB.current = c.id; save(); renderCoSelect(); return c;
}
function stockTarget(st) { return `${st.ar} (${st.en}) — رمز تداول ${st.s} — ${MK_TXT[st.mk]}، قطاع ${st.sec}`; }
async function analyzeStock(sym, { go: goAfter } = {}) {
  const st = SAUDI.find(x => x.s === sym); if (!st) return;
  const c = openStock(st); const year = String(SET.valYear || new Date().getFullYear() + 1);
  c.aiStatus = 'run'; refreshViews();
  try { await analyze(c, 'full', { target: stockTarget(st), year, notes: '' }); const p = autoAdopt(c); c.aiStatus = p ? 'ok' : 'err'; }
  catch (e) { c.aiStatus = 'err'; if (e.message === 'no-keys') throw e; }
  save(); refreshViews();
  if (goAfter && DB.current === c.id) go('dash');
}
async function runQueue() {
  if (QUEUE.running) return; QUEUE.running = true;
  while (QUEUE.items.length) {
    const s = QUEUE.items.shift(); QUEUE.current = s; refreshViews();
    try { await analyzeStock(s); } catch (e) { if (e.message === 'no-keys') { QUEUE.items = []; break; } }
    QUEUE.done++;
  }
  QUEUE.running = false; QUEUE.current = null; refreshViews(); toast('اكتمل تحليل الأسهم المحددة');
}

    const info = st => { const c = coBySym(st.s); if (!c) return null; const R = revised(c); if (!R.complete) return { c }; const cl = classify(c); return { c, R, S: signal(c, R, cl), cl }; };
    let data = rows.map(st => ({ st, i: info(st) }));
    if (MK.only === 'done') data = data.filter(x => x.i && x.i.R); if (MK.only === 'buy') data = data.filter(x => x.i && x.i.S && x.i.S.s === 'buy'); if (MK.only === 'sell') data = data.filter(x => x.i && x.i.S && x.i.S.s === 'sell');
    const sel = new Set(MK.sel);
    $('#o-mkbar').innerHTML = `<span class="small muted">${data.length} سهماً</span>
      <button class="btn sm" data-act="mkRunSel"${sel.size && !QUEUE.running ? '' : ' disabled'}>تحليل المحدد (${sel.size})</button>
      <button class="btn ghost sm" data-act="mkClearSel"${sel.size ? '' : ' disabled'}>إلغاء التحديد</button>
      ${QUEUE.running ? `<span class="chip warn">يحلل الآن ${esc((SAUDI.find(x => x.s === QUEUE.current) || {}).ar || '')} · ${QUEUE.done} من ${QUEUE.total}</span><button class="btn ghost danger sm" data-act="mkStop">إيقاف بعد الحالي</button>` : ''}
      <span class="small muted">كل سهم يستهلك طلباً من كل نموذج مفعّل.</span>`;
    const show = data.slice(0, 400);
    $('#o-mk').innerHTML = !show.length ? '<div class="empty">لا توجد أسهم مطابقة.</div>' : `<div class="tw"><table><thead><tr><th style="width:34px"></th><th>الرمز</th><th>الشركة</th><th>القطاع</th><th class="n">السعر</th><th class="n">القيمة العادلة</th><th class="n">الخصم</th><th>التصنيف</th><th>الإشارة</th><th></th></tr></thead><tbody>
      ${show.map(({ st, i }) => { const c = i && i.c; const running = (c && c.aiStatus === 'run') || QUEUE.current === st.s; const price = c ? num(c.price) : NaN; const fv = i && i.R ? i.R.fv : NaN; const disc = (fv - price) / fv * 100;
        return `<tr><td><input type="checkbox" data-act="mkSel" data-s="${st.s}"${sel.has(st.s) ? ' checked' : ''} aria-label="تحديد ${esc(st.ar)}" style="accent-color:var(--gold)"></td>
          <td class="n"><b>${st.s}</b></td><td style="min-width:180px"><div>${esc(st.ar)}</div><div class="small faint" style="direction:ltr;text-align:right">${esc(st.en)}</div></td><td class="small muted">${esc(st.sec)}</td>
          <td class="n">${isNaN(price) ? '—' : fmt(price)}</td><td class="n" style="color:var(--gold2);font-weight:600">${isNaN(fv) ? '—' : fmt(fv)}</td>
          <td class="n" style="color:var(${disc >= 0 ? '--up' : '--down'})">${isFinite(disc) ? pct(disc) : '—'}</td>
          <td>${i && i.cl && i.cl.info ? chip(i.cl.info.t.replace(/ \(.*\)/, ''), i.cl.info.cls) : ''}</td>
          <td>${running ? '<span class="chip warn"><span class="dot run"></span> يحلل</span>' : i && i.S && i.S.label !== '—' ? chip(i.S.label, i.S.s === 'buy' ? 'up' : i.S.s === 'sell' ? 'down' : 'warn') : c && c.aiStatus === 'err' ? chip('تعذر', 'down') : ''}</td>
          <td style="white-space:nowrap"><button class="btn sm${i && i.R ? ' ghost' : ''}" data-act="mkAnalyze" data-s="${st.s}"${running ? ' disabled' : ''}>${i && i.R ? 'تحديث' : 'تحليل'}</button>${c ? ` <button class="btn ghost sm" data-act="mkOpen" data-s="${st.s}">فتح</button>` : ''}</td></tr>`; }).join('')}</tbody></table></div>`;
  }
};
document.addEventListener('input', e => { if (e.target.id === 'stkQ') { MK.q = e.target.value; saveMK(); clearTimeout(upT); upT = setTimeout(() => VIEWS.market.update(), 120); } });
document.addEventListener('change', e => {
  const id = e.target.id;
  if (id === 'stkMk') { MK.mk = e.target.value; MK.sec = ''; saveMK(); render(); }
  if (id === 'stkSec') { MK.sec = e.target.value; saveMK(); VIEWS.market.update(); }
  if (id === 'stkOnly') { MK.only = e.target.value; saveMK(); VIEWS.market.update(); }
});
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b) return; const a = b.dataset.act; const s = b.dataset.s;
  if (a === 'mkSel') { const set = new Set(MK.sel); b.checked ? set.add(s) : set.delete(s); MK.sel = [...set]; saveMK(); VIEWS.market.update(); }
  if (a === 'mkClearSel') { MK.sel = []; saveMK(); VIEWS.market.update(); }
  if (a === 'mkOpen') { openStock(SAUDI.find(x => x.s === s)); go('dash'); }
  if (a === 'mkAnalyze') { try { await analyzeStock(s, { go: true }); } catch (err) { } }
  if (a === 'mkRunSel') { QUEUE.items = MK.sel.slice(); QUEUE.total = QUEUE.items.length; QUEUE.done = 0; MK.sel = []; saveMK(); runQueue(); }
  if (a === 'mkStop') { QUEUE.items = []; toast('سيتوقف بعد السهم الحالي'); }
});
renderCoSelect(); renderNav(); render();

</script>
</body>
</html>
